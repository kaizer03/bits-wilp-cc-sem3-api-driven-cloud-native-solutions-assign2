name: northstar-support
services:
  app:
    build: .
    image: northstar-support:local
    ports:
      - "127.0.0.1:${APP_PORT:-8092}:8092"
    environment:
      MODEL_DEVICE: cpu
      CPU_QUANTIZE: "0"
      GENERATION_PROFILE: compact
      TORCH_NUM_THREADS: ${TORCH_NUM_THREADS:-4}
      DATABASE_URL: sqlite:////app/.runtime/support.db
    volumes:
      - ./.models:/app/.models:ro
      - support-data:/app/.runtime
    restart: unless-stopped
volumes:
  support-data:
